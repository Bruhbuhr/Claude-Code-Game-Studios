    if (ok) { ctx.fillStyle = 'rgba(140,240,122,0.12)'; ctx.fillRect(c.x + 2, y, c.w - 4, c.row - 2); }
    text(`${i + 1} ${r.name}${r.yield ? ' x' + r.yield() : ''}`, c.x + 6, y + 7, 10, owned ? '#8a86a0' : ok ? '#ffffff' : '#a9a4c0', 'left');
    const need = Object.keys(cost).map(k => `${k} ${Math.min(s.inv[k], cost[k])}/${cost[k]}`).join('  ');
    const lack = Object.keys(cost).find(k => s.inv[k] < cost[k]);
    text(owned ? 'you have it' : ok ? need : `${need}  (${lack}: ${WHERE[lack]})`, c.x + 14, y + 18, 8, owned ? '#8a86a0' : ok ? '#8cf07a' : '#c9a8a0', 'left');
  });
}
function banner(title, lines) {
  ctx.fillStyle = 'rgba(8,8,20,0.78)'; ctx.fillRect(0, 0, W, H);
  text(title, W / 2, 84, 32, '#fff4b0');
  lines.forEach((l, i) => text(l, W / 2, 140 + i * 22, 10, i === lines.length - 1 ? '#ffffff' : '#d8d4e8'));
}

// ---- Scenes ------------------------------------------------------------------------------------------
const scenes = {
  figures: { // every figure side by side, for the outline check (?scene=figures)
    update(dt) { state.t += dt; },
    draw() {
      clear('#1b1830');
      const list = [['Digger (you)', SPR.you[0]], ['Gnawer', SPR.gnawer[0]], ['Leaper', SPR.leaper[0]], ['Duskwing', SPR.flyer[0]]];
      list.forEach(([name, sp], i) => {
        const cx = 80 + i * 160, k = 5;
        ctx.fillStyle = '#2b2748'; ctx.fillRect(cx - 62, 70, 124, 200);
        ctx.drawImage(sp, Math.round(cx - sp.width * k / 2), Math.round(210 - sp.height * k), sp.width * k, sp.height * k);
        text(name, cx, 250, 12, '#fff');
      });
      text('Nightfall Hollow: the digger and the three things that come at night', W / 2, 36, 12, '#fff4b0');
    },
  },
  title: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || pressed('Space') || mouse.click) { mouse.click = false; mouse.l = false; scene = 'play'; }
    },
    draw() {
      drawWorld();
      banner(TITLE, ['Dig by day. Craft what you find. Hold your shelter through three nights.', ...CONTROLS, 'Enter or click to start']);
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      play(dt);
    },
    draw() { drawWorld(); drawHud(); },
  },
  pause: {
    update() {
      mouse.click = false;
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyR')) { reset(); scene = 'play'; }
    },
    draw() { drawWorld(); banner('Paused', ['P: back to the hollow', 'R: leave this world and start a fresh one', 'M: mute']); },
  },
  results: {
    update() { mouse.click = false; if (pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      const s = state;
      drawWorld();
      banner('Dawn', [s.gained, `${s.dug} blocks dug  -  ${s.killed} monsters felled  -  woke at the bed ${s.deaths} time${s.deaths === 1 ? '' : 's'}`, 'Enter: a fresh world nobody has seen']);
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
